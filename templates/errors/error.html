{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }} | Ateker Music{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto text-center py-24 px-4">
    <p class="text-6xl font-bold text-primary-500 mb-4">{{ code }}</p>
    <h1 class="text-2xl font-semibold text-gray-900 mb-3">{{ title }}</h1>
    <p class="text-gray-600 mb-8">{{ message }}</p>
    <a href="{{ url_for('public.home') }}" class="inline-block bg-primary-500 text-white px-6 py-3 rounded-lg font-medium hover:bg-primary-600">
        Back to Home
    </a>
</div>
{% endblock %}
