name: Dependency security scan

# Runs weekly and on every change to requirements.txt, so a newly-disclosed
# CVE in a pinned dependency gets caught even if nobody touches the repo
# that week. This only *reports* - it never auto-upgrades or auto-merges,
# since a security patch can still carry a breaking change (see
# SECURITY.md's dependency update policy).

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  pull_request:
    paths:
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --desc
        # Fails the workflow (and shows red in the Actions tab / PR checks)
        # if any pinned package has a known advisory. Intentionally does
        # NOT auto-fix - a human should review and test before bumping a
        # version, per SECURITY.md.
